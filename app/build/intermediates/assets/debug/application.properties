server.port=8443
nano.nsd.enabled=true
nano.nsd.name=sprintt
nano.nsd.type=_https._tcp.
nano.nsd.host-resolution=true

# Configuração SSL/TLS HTTPS via PKCS12 (mkcert)
server.ssl.enabled=true
server.ssl.key-store=keystore.p12
server.ssl.key-store-password=changeit
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=ticketmaster-ssl
server.ssl.protocols=TLSv1.2

# Ativação explícita do Swagger OpenAPI no nano-spring (sobrepõe low-memory)
nano.swagger.enabled=true
nano.swagger.title=sprintt Core API
nano.swagger.version=2.1.0
nano.swagger.description=API REST de Engenharia e Gestão Ágil Multi-Projetos, Sprints e Backlog
nano.swagger.server-url=/
