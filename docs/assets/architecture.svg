<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="100%" height="100%" style="background: transparent; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradientes -->
    <linearGradient id="bgBoxGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#172033" />
    </linearGradient>

    <linearGradient id="androidHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="serverHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.15" />
    </linearGradient>

    <linearGradient id="clientHeaderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818cf8" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#f43f5e" stop-opacity="0.1" />
    </linearGradient>

    <linearGradient id="networkLineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#34d399" />
    </linearGradient>

    <!-- Marcadores de Seta -->
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowEmerald" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#34d399" />
    </marker>
    <marker id="arrowIndigo" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#818cf8" />
    </marker>
    <marker id="arrowAmber" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M 0 1 L 7 4 L 0 7 z" fill="#fbbf24" />
    </marker>

    <!-- Sombra Suave -->
    <filter id="boxShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- ========================================== -->
  <!-- GRUPO PRINCIPAL: DISPOSITIVO ANDROID       -->
  <!-- ========================================== -->
  <g transform="translate(30, 20)">
    <!-- Container Externo do Celular / Android -->
    <rect x="0" y="0" width="580" height="570" rx="20" fill="url(#bgBoxGradient)" stroke="#334155" stroke-width="2" filter="url(#boxShadow)" />
    
    <!-- Cabeçalho Android -->
    <rect x="0" y="0" width="580" height="50" rx="20" fill="url(#androidHeaderGrad)" />
    <path d="M 0 50 L 580 50" stroke="#334155" stroke-width="1" />
    <circle cx="28" cy="25" r="7" fill="#34d399" />
    <text x="44" y="30" font-size="15" font-weight="700" fill="#f8fafc" letter-spacing="0.5">DISPOSITIVO ANDROID (ex: Moto G4 Play)</text>
    <rect x="420" y="14" width="140" height="22" rx="11" fill="#334155" />
    <text x="490" y="29" font-size="11" font-weight="600" fill="#34d399" text-anchor="middle">SO: Android 7.1+ / ARM</text>

    <!-- 1. Camada de UI Nativa -->
    <g transform="translate(20, 68)">
      <rect x="0" y="0" width="255" height="235" rx="12" fill="url(#cardGradient)" stroke="#334155" stroke-width="1.5" />
      <rect x="0" y="0" width="255" height="36" rx="12" fill="#334155" fill-opacity="0.4" />
      <text x="14" y="23" font-size="13" font-weight="700" fill="#38bdf8">📱 UI Nativa Android (Kotlin)</text>

      <g transform="translate(14, 52)" font-size="11.5" fill="#cbd5e1">
        <rect x="0" y="0" width="227" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="10" y="20" fill="#f8fafc" font-weight="600">MainActivity &amp; ViewBinding</text>

        <rect x="0" y="42" width="227" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="10" y="62" fill="#f8fafc" font-weight="600">Fragments (Listas &amp; Kanban)</text>

        <rect x="0" y="84" width="227" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="10" y="104" fill="#f8fafc" font-weight="600">IssueDetailActivity</text>

        <rect x="0" y="126" width="227" height="32" rx="6" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="10" y="146" fill="#f8fafc" font-weight="600">BottomSheets (Criação)</text>
      </g>
    </g>

    <!-- 2. Repositório Central de Dados -->
    <g transform="translate(20, 320)">
      <rect x="0" y="0" width="255" height="225" rx="12" fill="url(#cardGradient)" stroke="#fbbf24" stroke-width="1.5" stroke-opacity="0.6" />
      <rect x="0" y="0" width="255" height="36" rx="12" fill="#fbbf24" fill-opacity="0.12" />
      <text x="14" y="23" font-size="13" font-weight="700" fill="#fbbf24">💾 TicketRepository (JSON)</text>

      <g transform="translate(14, 48)" font-size="11" fill="#cbd5e1">
        <rect x="0" y="0" width="227" height="26" rx="5" fill="#0f172a" stroke="#334155" />
        <text x="10" y="17" fill="#fbbf24" font-weight="600">📁 projects.json &amp; issues.json</text>

        <rect x="0" y="34" width="227" height="26" rx="5" fill="#0f172a" stroke="#334155" />
        <text x="10" y="51" fill="#f8fafc">Pipeline Configurável (Colunas)</text>

        <rect x="0" y="68" width="227" height="26" rx="5" fill="#0f172a" stroke="#334155" />
        <text x="10" y="85" fill="#f8fafc">Usuários &amp; Senhas (HMAC+Salt)</text>

        <rect x="0" y="102" width="227" height="26" rx="5" fill="#0f172a" stroke="#334155" />
        <text x="10" y="119" fill="#f8fafc">Sprints &amp; Subtarefas</text>

        <rect x="0" y="136" width="227" height="26" rx="5" fill="#0f172a" stroke="#334155" />
        <text x="10" y="153" fill="#94a3b8">Sync Thread-Safe (ReentrantLock)</text>
      </g>
    </g>

    <!-- Linha Bidirecional UI <-> Repositório -->
    <path d="M 147 303 L 147 320" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)" />
    <path d="M 147 320 L 147 303" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />

    <!-- 3. Camada do Servidor Nano-Spring -->
    <g transform="translate(295, 68)">
      <rect x="0" y="0" width="265" height="477" rx="12" fill="url(#cardGradient)" stroke="#38bdf8" stroke-width="1.5" />
      <rect x="0" y="0" width="265" height="36" rx="12" fill="url(#serverHeaderGrad)" />
      <text x="14" y="23" font-size="13" font-weight="700" fill="#38bdf8">⚡ Nano-Spring Server Service</text>

      <g transform="translate(14, 48)">
        <!-- Thread Pool Runner -->
        <rect x="0" y="0" width="237" height="64" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="10" y="20" font-size="11.5" font-weight="700" fill="#38bdf8">ThreadPoolAsyncRunner</text>
        <text x="10" y="38" font-size="10" fill="#94a3b8">Core: 6 threads | Max: 8 threads</text>
        <text x="10" y="52" font-size="10" fill="#34d399">✓ Previne Thread Starvation com SSE</text>

        <!-- REST APIs -->
        <rect x="0" y="74" width="237" height="88" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="10" y="93" font-size="11.5" font-weight="700" fill="#f8fafc">Controladores REST</text>
        <text x="10" y="110" font-size="10.5" fill="#cbd5e1">• ProjectApiController &amp; Columns</text>
        <text x="10" y="126" font-size="10.5" fill="#cbd5e1">• IssueApiController &amp; Sprints</text>
        <text x="10" y="142" font-size="10.5" fill="#cbd5e1">• AuthApiController &amp; Users</text>

        <!-- Motor HTML & Mustache -->
        <rect x="0" y="172" width="237" height="66" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="10" y="191" font-size="11.5" font-weight="700" fill="#f8fafc">JiraWebController (HTML)</text>
        <text x="10" y="208" font-size="10.5" fill="#cbd5e1">• JMustache Template Engine</text>
        <text x="10" y="224" font-size="10.5" fill="#cbd5e1">• Fragmentos Dinâmicos HTMX</text>

        <!-- SSE Telemetria -->
        <rect x="0" y="248" width="237" height="72" rx="8" fill="#0f172a" stroke="#34d399" stroke-width="1" stroke-opacity="0.7" />
        <text x="10" y="267" font-size="11.5" font-weight="700" fill="#34d399">⚡ Telemetria de Bateria (SSE)</text>
        <text x="10" y="284" font-size="10.5" fill="#cbd5e1">• SseEmitter (Timeout: 45s)</text>
        <text x="10" y="300" font-size="10.5" fill="#cbd5e1">• BroadcastReceiver do Android</text>
        <text x="10" y="314" font-size="9.5" fill="#94a3b8">GET /api/v1/server/battery-sse</text>

        <!-- TLS & Zeroconf -->
        <rect x="0" y="330" width="237" height="84" rx="8" fill="#0f172a" stroke="#334155" stroke-width="1" />
        <text x="10" y="349" font-size="11.5" font-weight="700" fill="#818cf8">Segurança &amp; Conectividade</text>
        <text x="10" y="367" font-size="10.5" fill="#cbd5e1">🔒 TLS 1.2 / Porta 8443 (PKCS12)</text>
        <text x="10" y="384" font-size="10.5" fill="#cbd5e1">📡 Zeroconf / mDNS: sprintt.local</text>
        <text x="10" y="401" font-size="10" fill="#94a3b8">WakeLock &amp; MulticastLock ativos</text>
      </g>
    </g>

    <!-- Linha Repositório <-> Servidor -->
    <path d="M 275 420 L 295 420" stroke="#fbbf24" stroke-width="2" marker-end="url(#arrowAmber)" />
    <path d="M 295 430 L 275 430" stroke="#38bdf8" stroke-width="2" marker-end="url(#arrowBlue)" />
  </g>

  <!-- ========================================== -->
  <!-- BARRAMENTO DE REDE / WI-FI (LAN)           -->
  <!-- ========================================== -->
  <g transform="translate(625, 230)">
    <!-- Linhas de Comunicação -->
    <!-- 1. HTTPS Requests -->
    <path d="M 0 0 L 80 0" stroke="#38bdf8" stroke-width="2.5" marker-end="url(#arrowBlue)" />
    <path d="M 80 14 L 0 14" stroke="#818cf8" stroke-width="2.5" marker-end="url(#arrowIndigo)" />

    <!-- 2. SSE Stream -->
    <path d="M 0 60 L 80 60" stroke="#34d399" stroke-width="2.5" stroke-dasharray="5,4" marker-end="url(#arrowEmerald)" />

    <!-- Badges de Protocolo -->
    <g transform="translate(40, -18)">
      <rect x="-35" y="-12" width="70" height="18" rx="9" fill="#0f172a" stroke="#38bdf8" stroke-width="1" />
      <text x="0" y="1" font-size="9.5" font-weight="700" fill="#38bdf8" text-anchor="middle">HTTPS / REST</text>
    </g>

    <g transform="translate(40, 80)">
      <rect x="-35" y="-8" width="70" height="18" rx="9" fill="#0f172a" stroke="#34d399" stroke-width="1" />
      <text x="0" y="5" font-size="9.5" font-weight="700" fill="#34d399" text-anchor="middle">SSE Stream</text>
    </g>
  </g>

  <!-- ========================================== -->
  <!-- GRUPO: CLIENTES DA REDE LOCAL              -->
  <!-- ========================================== -->
  <g transform="translate(720, 20)">
    <!-- Container Clientes Web -->
    <rect x="0" y="0" width="230" height="570" rx="20" fill="url(#bgBoxGradient)" stroke="#818cf8" stroke-width="2" filter="url(#boxShadow)" />
    
    <!-- Cabeçalho Clientes -->
    <rect x="0" y="0" width="230" height="50" rx="20" fill="url(#clientHeaderGrad)" />
    <path d="M 0 50 L 230 50" stroke="#334155" stroke-width="1" />
    <circle cx="24" cy="25" r="7" fill="#818cf8" />
    <text x="40" y="30" font-size="14" font-weight="700" fill="#f8fafc">CLIENTES WEB (LAN)</text>

    <!-- Conteúdo dos Clientes -->
    <g transform="translate(14, 68)">
      <!-- Desktop & Mobile Browsers -->
      <rect x="0" y="0" width="202" height="74" rx="10" fill="url(#cardGradient)" stroke="#334155" stroke-width="1" />
      <text x="12" y="22" font-size="12" font-weight="700" fill="#818cf8">💻 Navegadores na Rede</text>
      <text x="12" y="40" font-size="10.5" fill="#cbd5e1">• Chrome, Firefox, Safari</text>
      <text x="12" y="56" font-size="10" fill="#38bdf8" font-family="monospace">https://sprintt.local:8443</text>

      <!-- Interface Web Sprintt -->
      <rect x="0" y="86" width="202" height="142" rx="10" fill="url(#cardGradient)" stroke="#334155" stroke-width="1" />
      <text x="12" y="108" font-size="12" font-weight="700" fill="#f8fafc">📊 Frontend Sprintt</text>
      <text x="12" y="128" font-size="10.5" fill="#cbd5e1">• Kanban Board Interativo</text>
      <text x="12" y="146" font-size="10.5" fill="#cbd5e1">• Colunas Customizáveis</text>
      <text x="12" y="164" font-size="10.5" fill="#cbd5e1">• Backlog &amp; Gestão Sprints</text>
      <text x="12" y="182" font-size="10.5" fill="#cbd5e1">• Modal Amplo de Detalhes</text>
      <text x="12" y="200" font-size="10.5" fill="#cbd5e1">• Relatórios Analíticos</text>
      <text x="12" y="218" font-size="10.5" fill="#cbd5e1">• Drag-and-Drop de Cards</text>

      <!-- Camada Reativa HTMX & SSE -->
      <rect x="0" y="240" width="202" height="120" rx="10" fill="url(#cardGradient)" stroke="#34d399" stroke-width="1" stroke-opacity="0.6" />
      <text x="12" y="262" font-size="12" font-weight="700" fill="#34d399">⚡ Reatividade Frontend</text>
      <text x="12" y="282" font-size="10.5" fill="#cbd5e1">• HTMX (AJAX sem recarregar)</text>
      <text x="12" y="300" font-size="10.5" fill="#cbd5e1">• EventSource SSE Listener</text>
      <text x="12" y="318" font-size="10.5" fill="#cbd5e1">• Badge de Bateria Reativo</text>
      <text x="12" y="336" font-size="10.5" fill="#cbd5e1">• Auto-close em beforeunload</text>
      <text x="12" y="350" font-size="9.5" fill="#94a3b8">Zero polling, economia de bateria</text>

      <!-- Segurança SSL -->
      <rect x="0" y="372" width="202" height="85" rx="10" fill="#0f172a" stroke="#334155" stroke-width="1" />
      <text x="12" y="394" font-size="12" font-weight="700" fill="#fbbf24">🔒 Certificado Raiz CA</text>
      <text x="12" y="412" font-size="10" fill="#cbd5e1">Instalação via /rootCA.pem</text>
      <text x="12" y="428" font-size="10" fill="#34d399">Conexão 100% Confiável</text>
      <text x="12" y="444" font-size="9.5" fill="#94a3b8">Sem avisos de perigo no browser</text>
    </g>
  </g>
</svg>
